apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-llm-orchestrator
  labels:
    app: ms-llm-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-llm-orchestrator
  template:
    metadata:
      labels:
        app: ms-llm-orchestrator
    spec:
      containers:
        - name: ms-llm-orchestrator
          image: yenyinglu/ms-llm-orchestrator:c7ed0561
          ports:
            - containerPort: 8000
          env:
            - name: LANGFUSE_BASE_URL
              value: "http://langfuse-web.ai.svc.cluster.local:3000"
            - name: LITELLM_HOST
              value: "http://litellm.ai.svc.cluster.local:4000"
            - name: MCP_HOST
              value: "http://mcp-context-forge.ai.svc.cluster.local:4444/servers/1a6556c61e9a400ea537e7e73c05a2db/mcp"
            - name: PGVECTOR_DBNAME
              value: ai_agent
            - name: PGVECTOR_COLLECTION
              value: memories
            - name: NEO4J_URL
              value: bolt://neo4j.infra-net.svc.cluster.local:7687
            - name: NEO4J_USERNAME
              value: neo4j
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: keyvault
                  key: GEMINI_API_KEY
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keyvault
                  key: NEO4J_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keyvault
                  key: POSTGRES_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: keyvault
                  key: LITELLM_API_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: keyvault
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: keyvault
                  key: LANGFUSE_SECRET_KEY
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: keyvault
                  key: MCP_TOKEN
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
